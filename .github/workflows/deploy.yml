name: Deploy Portfolio to AWS EC2 (Nginx)

on:
  push:
    branches:
      - main # Triggers automatically on push to main

jobs:
  deploy-to-nginx:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Pull the latest code into the GitHub Runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Securely transfer files to a temporary staging directory on EC2
      - name: Copy portfolio files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "./*" 
          target: "/home/${{ secrets.AWS_EC2_USERNAME }}/portfolio_staging"

      # Step 3: SSH into EC2, sync files to Nginx web root, and apply security permissions
      - name: Execute deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            # Sync files from staging to the Nginx document root
            sudo rsync -av /home/${{ secrets.AWS_EC2_USERNAME }}/portfolio_staging/ /var/www/html/
            
            # Remove the temporary staging directory
            rm -rf /home/${{ secrets.AWS_EC2_USERNAME }}/portfolio_staging
            
            # Assign ownership to the Nginx user (www-data)
            sudo chown -R www-data:www-data /var/www/html/
            
            # Apply strict principle-of-least-privilege permissions
            sudo find /var/www/html/ -type d -exec chmod 755 {} \; # Directories: Read/Execute
            sudo find /var/www/html/ -type f -exec chmod 644 {} \; # Files: Read Only
            
            # Reload Nginx gracefully without dropping active connections
            sudo systemctl reload nginx
            
